<!DOCTYPE HTML>
<html>

<head>
	<title>Glademeet</title>
	<meta charset="utf-8" />
	<base href="/kastorix/Kastorix/">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="kastorix.css" />
	<link rel="icon" type="image/x-icon" href="/images/Kastorix/ManaIcon.png">
</head>

<body class="is-preload">
	<!-- Header -->
	<div id="header-placeholder"></div>
	<!-- Main -->
	<div id="main">
		<!-- Main Projects -->
		<section id="Main Projects" class="sectionText">
			<header>
				<h3 class="portfolio-title">Glademeet</h3>
			</header>
			<div class="portfolio-row reverse"> <!-- Glademeet -->
				<div class="portfolio-image large">
					<img src="/images/Kastorix/Maps/Eastern Meibor.jpg" alt="World Map" />
				</div>
				<div class="portfolio-text">
					<p class="portfolio-description">
					<h3 class="portfolio-title">Overview</h3>
					<!-- Overview Text Below -->
					<p>Glademeet is a large lake in eastern <a href="Worldbuilding/Geography/Meibor.html">Meibor</a>, on
						the border of <a href="Worldbuilding/Nations/Heksan.html">Heksan</a> and <a
							href="Worldbuilding/Nations/Ganderei.html">Ganderei</a>.</p>
				</div>
			</div>
		</section>
	</div>
	<!-- Footer -->
	<div id="footer">
		<!-- Copyright -->
		<ul class="copyright">
			<li>&copy; Edvin Skogsholm Sanne's Portfolio. All rights reserved.</li>
			<li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
		</ul>
	</div>
	<!-- Scripts -->
	<script>
		fetch('rpgheader.html')
			.then(response => response.text())
			.then(data => {
				document.getElementById('header-placeholder').innerHTML = data;
			});
		// Close dropdowns when clicking outside
		window.onclick = function (event) {
			if (!event.target.matches('.dropbtn')) {
				var dropdowns = document.getElementsByClassName("dropdown-content");
				for (var i = 0; i < dropdowns.length; i++) {
					var openDropdown = dropdowns[i];
					if (openDropdown.style.display === "block") {
						openDropdown.style.display = "none";
					}
				}
			}
		};
	</script>
</body>

</html>
