<!DOCTYPE HTML>
<html>
	<head>
		<title>Conditions</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="kastorix.css" />
		<link rel="icon" type="image/x-icon" href="/images/Kastorix/ManaIcon.png">
	</head>
	<body class="is-preload">
		<!-- Header -->
		<div id="header-placeholder"></div>
		<!-- Main -->
			<div id="main">
				<!-- Main Projects -->
					<section id="Main Projects" class="sectionText">
						<header>
							<h3 class="portfolio-title">Conditions</h3>
							<p class="portfolio-text">
								These are the basic conditions, bla bla
							</p>
						</header>
						<div class="search-container">
							<input type="text" id="searchInput" placeholder="Search for conditions..." title="Type in a conditions name">
						</div>
						<div id="conditions_Table"></div>
					</section>
			</div>
		<!-- Footer -->
			<div id="footer">
				<!-- Copyright -->
					<ul class="copyright">
						<li>&copy; Edvin Skogsholm Sanne's Portfolio. All rights reserved.</li><li>Design: <a href="http://html5up.net">HTML5 UP</a></li>
					</ul>
			</div>
		<!-- Scripts -->
			<script src="sortAndSearchTables.js"></script>
			<script>
				fetch('rpgheader.html')
					.then(response => response.text())
					.then(data => {
						document.getElementById('header-placeholder').innerHTML = data;
					});

				fetch('sqlite/build/conditions.html')
					.then(response => response.text())
					.then(data => {
						document.getElementById('conditions_Table').innerHTML = data;
						setTableId("conditions_Table"); // Pass the ID as a string
					});
			</script>
	</body>
</html>
