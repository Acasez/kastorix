<!DOCTYPE HTML>
<html>
	<head>
		<title>Ancestry Feats</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="kastorix.css" />
		<link rel="icon" type="image/x-icon" href="/images/Kastorix/ManaIcon.png">
	</head>
	<style>
		.creature-container {
			width: 100%;
			max-width: 825px;
			margin: 0 auto;
			background-color: #1a1a1a;
			color: #e0d8d8;
			font-family: 'Arial', sans-serif;
			border: 2px solid #5a3921;
			box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
		}

		.creature-header {
			background-color: #3a2a1e;
			padding: 10px;
			text-align: center;
			border-bottom: 1px solid #5a3921;
		}

		.creature-name {
			font-size: 24px;
			margin: 0;
			color: #d8b87c;
		}

		.creature-type {
			font-size: 14px;
			color: #a8a8a8;
			font-weight: bold;
		}

		.creature-content {
			display: flex;
			justify-content: space-between;
			padding: 15px;
		}

		.creature-stats {
			flex: 2;
			padding-right: 20px;
		}

		.creature-image {
			flex: 1;
			text-align: center;
		}

		.creature-image img {
			max-width: 100%;
			height: auto;
			border: 1px solid #5a3921;
		}

		.creature-actions {
			padding: 15px;
			border-top: 1px solid #5a3921;
		}

		.field-container {
			display: flex;
			align-items: center;
			gap: 1em;
		}

		.field-container p {
			margin: 0;
			margin-bottom: -5px; /* Space between label and input */
			font-weight: bold;
			font-size: 32px;
		}

		.sidebar input {
			width: 100%; /* Make inputs fill the form group */
			padding: 5px;
			box-sizing: border-box; /* Include padding in width */
		}

		.save-label {
			font-weight: bold;
			color: #4da6ff;
			margin-top: -20px;
			margin-bottom: -30px;
			font-size: 22px;
			display: flex;
		}
			.save-label p{
				margin-left: 5px;
				margin-right: 5px;
				font-size: clamp(12px, 1.5vw, 18px);
			}
		
		.extendableList{
			display: inline-flex;
			flex-direction: column;
			margin-top: 0.5em;
			margin-bottom: 0.5em;
			width: 400px;
		}
		.spellData{
			display: flex;
			flex-direction: row;
		}
		.spellActions, .attackBonus{
			width: 50px;
		}
		.input-field{
			width: 50px;
		}
		.sidebar {
			width: 220px;
			box-shadow: 10px black;
			border-radius: 0% 8px 8px 0%;
			margin-right: 20px; /* Optional: Add spacing between sidebar and main content */
		}
		.container {
			display: flex;
			flex-direction: row;
		}
		/* Form Row Styling */
		.form-row {
			display: flex;
			justify-content: space-between;
			margin-bottom: 0px;
		}

		.form-group {
			flex: 1;
			margin: 0 5px;
		}

		/* Resource Bars Container */
		.resource-bars-container {
			margin-bottom: 10px;
		}
		/* Section Titles */
		.section-title {
			font-weight: bold;
			margin-bottom: 10px;
			padding-bottom: 5px;
			border-bottom: 1px solid #333;
		}
		/*Stats*/
		.stats-wrapper {
			display: flex;
			justify-content: center;
			width: 100%;
			flex-wrap: wrap;
			gap: 10px;
		}

		.stats-container {
			display: flex;
			flex-direction: row;
			flex-wrap: wrap;
			gap: 10px;
			margin-top: 10px;
			justify-content: center; /* Center the save boxes horizontally */
			gap: 20px; /* Space between save boxes */
		}
		.stat-input-container {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 5px;
		}

		.stat-input {
			width: 50px;
			text-align: center;
			margin-top: -5px;
			margin-bottom: -5px;
		}

		textarea {
			width: 100%;
			padding: 8px;
			margin-top: 5px;
			border: 1px solid #ddd;
			border-radius: 4px;
			max-width: 360px;
		}

		.stat-box, .save-box {
			flex: 1;
			min-width: 100px;
			border: 1px solid #f52eba;
			padding: 0px 5px 0px 5px;
			border-radius: 4px;
			text-align: center;
			max-width: fit-content;
		}

		.stat-box p{
			margin-top: -5px;
			margin-bottom: -5px;
			font-size: 22px;
		}
		/*Resource Bars*/
		.resource-bars-container {
			display: flex;
			justify-content: center;
			gap: 20px;
			margin-top: 10px;
		}
		.resource-bar-wrapper {
			display: flex;
			flex-direction: column; /* Stack bar above inputs */
			align-items: flex-start;
			margin: 5px;
		}

		.bar-container {
			height: 20px;
			width: 100%;
			background-color: #ddd;
			border-radius: 10px;
			overflow: hidden;
		}

		.bar {
			height: 100%;
			border-radius: 10px;
			transition: width 0.3s;
		}

		.resource-inputs {
			display: flex;
			align-items: center;
			margin-top: 5px;
			margin-bottom: -15px;
		}

		.resource-inputs label {
			margin-right: 5px;
		}
		.saveLoadCreatureMenu{
			display: flex;
			align-items: center;
			margin-top: -10px;
			margin-bottom: -10px;
		}
	</style>
	<body class="is-preload">
		<!-- Header -->
		<div id="header-placeholder"></div>
		<div class="container">
			<div class="sidebar">
				<div class="levelSelection" id="levelZero">
					<p><u>Initiative Tracker</u></p>
					<div class="initiativeContainer">
						<div class="initiative-creature">
							<input type="text" placeholder="Character Name" id="charName">
							<div class="container">
								<input type="number" class="stat-input" min="0" max="50" value="0">
								<button class="removeInitiative">×</button>
							</div>
							<input type="text" placeholder="Character Name" id="charName">
							<div class="container">
								<input type="number" class="stat-input" min="0" max="50" value="0">
								<button class="removeInitiative">×</button>
							</div>
							<input type="text" placeholder="Character Name" id="charName">
							<div class="container">
								<input type="number" class="stat-input" min="0" max="50" value="0">
								<button class="removeInitiative">×</button>
							</div>
							<input type="text" placeholder="Character Name" id="charName">
							<div class="container">
								<input type="number" class="stat-input" min="0" max="50" value="0">
								<button class="removeInitiative">×</button>
							</div>
							<input type="text" placeholder="Character Name" id="charName">
							<div class="container">
								<input type="number" class="stat-input" min="0" max="50" value="0">
								<button class="removeInitiative">×</button>
							</div>
						</div>
						<button id="addInitiativeCreature">+</button>
					</div>
				</div>
			</div>	
				
			<!-- Hidden Initiative Template -->
			<template id="initiativeTemplate">
				<input type="text" placeholder="Character Name" id="charName">
				<div class="container">
					<input type="number" class="stat-input" min="0" max="50" value="0">
					<button class="removeInitiative">×</button>
				</div>
			</template>
			</div>
		<!-- Scripts -->
			<script>
				fetch('rpgheader.html')
					.then(response => response.text())
					.then(data => {
						document.getElementById('header-placeholder').innerHTML = data;
					});
				
				function updateBar(type, context = document) {
					const currentInput = context.querySelector(`[id='${type}']`);
					const maxInput = context.querySelector(`[id='max${type.charAt(0).toUpperCase() + type.slice(1)}']`);
					const bar = context.querySelector(`#${type}Bar`);

					if (!currentInput || !maxInput || !bar) return;

					let currentValue = parseInt(currentInput.value) || 0;
					let maxValue = parseInt(maxInput.value) || 1;

					if (currentValue > maxValue) {
						currentValue = maxValue;
						currentInput.value = maxValue;
					}
					const percentage = (currentValue / maxValue) * 100;
					bar.style.width = `${percentage}%`;
				}

				// Attach event listeners for all resource bars in all creature blocks
				document.addEventListener('input', function(e) {
					const resourceIds = ['health', 'aura', 'mana'];
					if (resourceIds.includes(e.target.id)) {
						const creatureContainer = e.target.closest('.creature-container');
						if (creatureContainer) {
							updateBar(e.target.id, creatureContainer);
						}
					}
				});

				// Add more Strikes
				document.getElementById('addStrike').addEventListener('click', function() {
					const container = document.getElementById('strikesContainer');
					const template = document.getElementById('strikeTemplate');
					const clone = template.content.cloneNode(true);
					container.appendChild(clone);
				});

				// Remove strike
				document.getElementById('strikesContainer').addEventListener('click', function(event) {
				// Check if the clicked element is a "remove" button
					if (event.target.classList.contains('removeStrike')) {
						// Remove the parent `.spellSection` of the clicked button
						event.target.parentElement.parentElement.remove();
					}
				});
				// Add more Actions
				document.getElementById('addAction').addEventListener('click', function() {
					const container = document.getElementById('actionsContainer');
					const template = document.getElementById('actionTemplate');
					const clone = template.content.cloneNode(true);
					container.appendChild(clone);
				});

				// Remove action
				document.getElementById('actionsContainer').addEventListener('click', function(event) {
				// Check if the clicked element is a "remove" button
					if (event.target.classList.contains('removeAction')) {
						// Remove the parent `.spellSection` of the clicked button
						event.target.parentElement.parentElement.remove();
					}
				});
				// Add more Initiative Creatures
				document.getElementById('addInitiativeCreature').addEventListener('click', function() {
					const container = document.getElementById('initiativeContainer');
					const template = document.getElementById('initiativeTemplate');
					const clone = template.content.cloneNode(true);
					container.appendChild(clone);
				});

				// Remove Initiative Creatures
				document.getElementById('initiativeContainer').addEventListener('click', function(event) {
				// Check if the clicked element is a "remove" button
					if (event.target.classList.contains('removeInitiative')) {
						// Remove the parent `.spellSection` of the clicked button
						event.target.parentElement.parentElement.remove();
					}
				});
				
				function saveCreature() {
					// Get the first (or currently edited) creature container
					const creature = document.querySelector('.creature-container');
					if (!creature) {
						alert('No creature found.');
						return;
					}

					// Get basic info
					const name = creature.querySelector('#creatureName')?.value || '';
					if (!name) {
						alert('Please enter a creature name.');
						return;
					}
					const traits = creature.querySelector('#creatureTraits')?.value || '';
					const senses = creature.querySelector('#creatureSenses')?.value || '';
					const languages = creature.querySelector('#creatureLanguages')?.value || '';
					const skills = creature.querySelector('#creatureSkills')?.value || '';
					const resistances = creature.querySelector('#creatureResistances')?.value || '';
					const speeds = creature.querySelector('#creatureSpeeds')?.value || '';
					const equipment = creature.querySelector('#equipment')?.value || '';
					const notes = creature.querySelector('#notes')?.value || '';

					// Stats
					const stats = {
						phy: creature.querySelector('.phy, #phy')?.value || '',
						dex: creature.querySelector('.dex, #dex')?.value || '',
						int: creature.querySelector('.int, #int')?.value || '',
						wil: creature.querySelector('.wil, #wil')?.value || ''
					};

					// Saves
					const saves = {
						fortitude: creature.querySelector('#fortitude')?.textContent || '',
						reflex: creature.querySelector('#reflex')?.textContent || '',
						will: creature.querySelector('#will')?.textContent || ''
					};

					// Resource bars
					const health = creature.querySelector('#health')?.value || '';
					const maxHealth = creature.querySelector('#maxHealth')?.value || '';
					const aura = creature.querySelector('#aura')?.value || '';
					const maxAura = creature.querySelector('#maxAura')?.value || '';
					const mana = creature.querySelector('#mana')?.value || '';
					const maxMana = creature.querySelector('#maxMana')?.value || '';

					// Strikes
					const strikes = [];
					creature.querySelectorAll('#strikesContainer .spellSection').forEach(section => {
						strikes.push({
							name: section.querySelector('.strikeName')?.value || '',
							attackBonus: section.querySelector('.attackBonus')?.value || '',
							damage: section.querySelector('.attackDamage')?.value || '',
							traits: section.querySelector('.strikeTraits')?.value || ''
						});
					});

					// Actions
					const actions = [];
					creature.querySelectorAll('#actionsContainer .spellSection').forEach(section => {
						actions.push({
							name: section.querySelector('.actionName')?.value || '',
							actions: section.querySelector('.actions')?.value || '',
							requirement: section.querySelector('.actionRequirement')?.value || '',
							effect: section.querySelector('.actionEffect')?.value || ''
						});
					});

					// Build creature data object
					const creatureData = {
						name,
						traits,
						senses,
						languages,
						skills,
						resistances,
						speeds,
						stats,
						saves,
						health,
						maxHealth,
						aura,
						maxAura,
						mana,
						maxMana,
						strikes,
						actions,
						equipment,
						notes
					};

					// Save to localStorage
					let creatures = JSON.parse(localStorage.getItem('ttrpgCreatures')) || [];
					const existingIndex = creatures.findIndex(c => c.name === name);
					if (existingIndex >= 0) {
						creatures[existingIndex] = creatureData;
					} else {
						creatures.push(creatureData);
					}
					localStorage.setItem('ttrpgCreatures', JSON.stringify(creatures));
					alert(`Creature "${name}" saved!`);
				}

				// Populate the dropdown with saved creatures
				function populateCreatureSelect() {
					const select = document.getElementById('creatureSelect');
					select.innerHTML = '';
					const creatures = JSON.parse(localStorage.getItem('ttrpgCreatures')) || [];
					creatures.forEach(c => {
						const option = document.createElement('option');
						option.value = c.name;
						option.textContent = c.name;
						select.appendChild(option);
					});
				}

				// Load a creature and insert it as a new block
				function loadCreature() {
					const name = document.getElementById('creatureSelect').value;
					const creatures = JSON.parse(localStorage.getItem('ttrpgCreatures')) || [];
					const data = creatures.find(c => c.name === name);
					if (!data) return alert('Creature not found.');

					// Clone the template
					const template = document.getElementById('creatureTemplate');
					const clone = template.content.cloneNode(true);
					const container = clone.querySelector('.creature-container');

					// Fill in the data (add more fields as needed)
					container.querySelector('#creatureName').value = data.name;
					container.querySelector('#creatureTraits').value = data.traits;
					container.querySelector('#creatureSenses').value = data.senses;
					container.querySelector('#creatureLanguages').value = data.languages;
					container.querySelector('#creatureSkills').value = data.skills;
					container.querySelector('#creatureResistances').value = data.resistances;
					container.querySelector('#creatureSpeeds').value = data.speeds;
					container.querySelector('#equipment').value = data.equipment;
					container.querySelector('#notes').value = data.notes;

					// Stats
					container.querySelector('#phy').value = data.stats.phy;
					container.querySelector('#dex').value = data.stats.dex;
					container.querySelector('#int').value = data.stats.int;
					container.querySelector('#wil').value = data.stats.wil;

					// Resource bars
					container.querySelector('#health').value = data.health;
					container.querySelector('#maxHealth').value = data.maxHealth;
					container.querySelector('#aura').value = data.aura;
					container.querySelector('#maxAura').value = data.maxAura;
					container.querySelector('#mana').value = data.mana;
					container.querySelector('#maxMana').value = data.maxMana;

					// Saving throws
					container.querySelector('#fortitude').textContent = data.saves.fortitude;
					container.querySelector('#reflex').textContent = data.saves.reflex;
					container.querySelector('#will').textContent = data.saves.will;

					// Strikes
					const strikesContainer = container.querySelector('#strikesContainer');
					strikesContainer.innerHTML = '';
					data.strikes.forEach(strike => {
						const strikeTemplate = document.getElementById('strikeTemplate');
						const strikeClone = strikeTemplate.content.cloneNode(true);
						strikeClone.querySelector('.strikeName').value = strike.name;
						strikeClone.querySelector('.attackBonus').value = strike.attackBonus;
						strikeClone.querySelector('.attackDamage').value = strike.damage;
						strikeClone.querySelector('.strikeTraits').value = strike.traits;
						strikesContainer.appendChild(strikeClone);
					});

					// Actions
					const actionsContainer = container.querySelector('#actionsContainer');
					actionsContainer.innerHTML = '';
					data.actions.forEach(action => {
						const actionTemplate = document.getElementById('actionTemplate');
						const actionClone = actionTemplate.content.cloneNode(true);
						actionClone.querySelector('.actionName').value = action.name;
						actionClone.querySelector('.actions').value = action.actions;
						actionClone.querySelector('.actionRequirement').value = action.requirement;
						actionClone.querySelector('.actionEffect').value = action.effect;
						actionsContainer.appendChild(actionClone);
					});

					// Add the filled creature to the page
					document.querySelector('.container').appendChild(clone);
				}

				// Add a blank creature from the template
				function addNewCreature() {
					const template = document.getElementById('creatureTemplate');
					const clone = template.content.cloneNode(true);
					document.querySelector('.container').appendChild(clone);
				}

				// Call this function when the page loads
				window.onload = function() {
					populateCreatureSelect();
				};
			</script>
	</body>
</html>
